[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-industrial-agent-workbench"
version = "0.0.1"
description = "Local-first workbench for building and running industrial agents (Python orchestrator + dsh plugin host)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pytesseract>=0.3.10",
  "pillow>=10.0",
  "python-docx>=1.1.0",
  "mcp>=2.0",
  "anyio>=4.0",
]
license = { text = "MIT" }
authors = [{ name = "Dharun Balaji" }]
keywords = ["agents", "industrial", "orchestration"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
workbench = "workbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
